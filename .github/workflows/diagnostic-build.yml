name: Build separate diagnostic APK
on:
  push:
    branches: ["arena/**"]
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/diagnostic/**'
      - '.github/workflows/diagnostic-build.yml'
    tags: ["diagnostic-*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools cmake;3.31.6
      - name: Build standalone diagnostic APK
        run: ./gradlew assembleDiagnostic --no-daemon --stacktrace
      - name: Verify application ID, entry point and native libraries
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/diagnostic/app-diagnostic.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/diagnostic-badging.txt
          grep -q "package: name='ru.npu.llamachat.diagnostic'" /tmp/diagnostic-badging.txt
          grep -q "launchable-activity: name='ru.npu.llamachat.MainActivity'" /tmp/diagnostic-badging.txt
          grep -q "application-label:.*диагностика" /tmp/diagnostic-badging.txt
          unzip -l "$APK" > /tmp/diagnostic-apk.txt
          grep -q 'lib/arm64-v8a/libQnnHtp.so' /tmp/diagnostic-apk.txt
          grep -qi 'lib/arm64-v8a/libQnnHtpV73Skel.so' /tmp/diagnostic-apk.txt
          grep -q 'lib/arm64-v8a/libggml-htp-v73.so' /tmp/diagnostic-apk.txt
          mkdir -p dist
          cp "$APK" dist/NPU_Llama_Chat-diagnostic-v0.0.5.1.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: NPU-diagnostic-v0.0.5.1
          path: |
            dist/NPU_Llama_Chat-diagnostic-v0.0.5.1.apk
            dist/SHA256SUMS.txt
      - name: Publish diagnostic APK
        if: startsWith(github.ref, 'refs/tags/diagnostic-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/NPU_Llama_Chat-diagnostic-v0.0.5.1.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
