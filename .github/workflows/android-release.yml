name: Android NPU Release Build

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Gradle APK (Hexagon NPU v0.0.1)
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Android SDK & CMake
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools cmake;3.31.6

      - name: Run Unit Tests & Assemble Debug + Release APKs
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log; then
            ERR_SUMMARY=$(grep -E "e: |ERROR:|Exception:|FAILURE:|What went wrong" -A 4 /tmp/gradle-build.log | tail -n 25 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Gradle Build Error::${ERR_SUMMARY}"
            exit 1
          fi

      - name: Verify Hexagon HTP v73 (Snapdragon 8s Gen 3) libraries inside Release APK
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            FOUND=$(find app/build/outputs/apk -type f | tr '\n' ' ')
            echo "::error title=Missing Release APK::Expected $RELEASE_APK, found: $FOUND"
            exit 1
          fi
          unzip -l "$RELEASE_APK" | tee /tmp/apk_contents.txt
          grep -q "lib/arm64-v8a/libnpu_llama_jni.so" /tmp/apk_contents.txt
          grep -q "lib/arm64-v8a/libllama.so" /tmp/apk_contents.txt
          grep -q "lib/arm64-v8a/libggml-hexagon.so" /tmp/apk_contents.txt
          grep -q "lib/arm64-v8a/libggml-htp-v73.so" /tmp/apk_contents.txt
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NPU_Llama_Chat-v0.0.1-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/NPU_Llama_Chat-v0.0.1-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: NPU_Llama_Chat-v0.0.1-apks
          path: |
            dist/NPU_Llama_Chat-v0.0.1-release.apk
            dist/NPU_Llama_Chat-v0.0.1-debug.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NPU_Llama_Chat-v0.0.1-release.apk
            dist/NPU_Llama_Chat-v0.0.1-debug.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
