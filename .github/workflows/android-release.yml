name: Android NPU Release Build

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза для публикации APK (например, v0.0.2)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Gradle APK (Hexagon NPU v0.0.2)
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Android SDK & CMake
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools cmake;3.31.6

      - name: Read appVersionName from app/build.gradle.kts
        id: meta
        run: |
          APP_VERSION=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          if [ -z "$APP_VERSION" ]; then
            echo "::error title=Missing Version::Could not extract appVersionName from app/build.gradle.kts"
            exit 1
          fi
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building NPU Llama Chat v${APP_VERSION}"

      - name: Run Unit Tests, Lint & Assemble Debug + Release APKs
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log; then
            ERR_SUMMARY=$(grep -E "e: |ERROR:|Exception:|FAILURE:|What went wrong" -A 4 /tmp/gradle-build.log | tail -n 25 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Gradle Build Error::${ERR_SUMMARY}"
            exit 1
          fi

      - name: Verify Hexagon HTP v73 (Snapdragon 8s Gen 3) libraries inside Release APK
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            FOUND=$(find app/build/outputs/apk -type f | tr '\n' ' ')
            echo "::error title=Missing Release APK::Expected $RELEASE_APK, found: $FOUND"
            exit 1
          fi
          unzip -l "$RELEASE_APK" | tee /tmp/apk_contents.txt
          grep -q "lib/arm64-v8a/libnpu_llama_jni.so" /tmp/apk_contents.txt
          grep -q "lib/arm64-v8a/libllama.so" /tmp/apk_contents.txt
          grep -q "lib/arm64-v8a/libggml-hexagon.so" /tmp/apk_contents.txt
          grep -q "lib/arm64-v8a/libggml-htp-v73.so" /tmp/apk_contents.txt
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NPU_Llama_Chat-v${APP_VERSION}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/NPU_Llama_Chat-v${APP_VERSION}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: NPU_Llama_Chat-v${{ steps.meta.outputs.version }}-apks
          path: |
            dist/NPU_Llama_Chat-v${{ steps.meta.outputs.version }}-release.apk
            dist/NPU_Llama_Chat-v${{ steps.meta.outputs.version }}-debug.apk
            dist/SHA256SUMS.txt

      - name: Upload APK Assets to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TARGET_TAG=""
          FORCE_UPLOAD="false"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TARGET_TAG="${GITHUB_REF_NAME}"
            FORCE_UPLOAD="true"
          elif [[ -n "${DISPATCH_TAG}" ]]; then
            TARGET_TAG="${DISPATCH_TAG}"
            FORCE_UPLOAD="true"
          elif gh release view "v${APP_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            HAS_APK=$(gh release view "v${APP_VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -c "NPU_Llama_Chat-v${APP_VERSION}-release.apk" || true)
            if [[ "${HAS_APK}" == "0" ]]; then
              TARGET_TAG="v${APP_VERSION}"
              FORCE_UPLOAD="true"
            fi
          fi

          if [[ -n "${TARGET_TAG}" && "${FORCE_UPLOAD}" == "true" ]]; then
            if ! gh release view "${TARGET_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release create "${TARGET_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "NPU Llama Chat ${TARGET_TAG}" \
                --generate-notes
            fi
            gh release upload "${TARGET_TAG}" \
              "dist/NPU_Llama_Chat-v${APP_VERSION}-release.apk" \
              "dist/NPU_Llama_Chat-v${APP_VERSION}-debug.apk" \
              dist/SHA256SUMS.txt \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          fi
